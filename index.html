<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spider Crawl</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  body.idle { cursor: none; }
  #hint {
    position: fixed; left: 50%; bottom: 4vh; transform: translateX(-50%);
    color: #777; font: 16px/1.5 system-ui, sans-serif; text-align: center;
    transition: opacity 1.5s; pointer-events: none;
  }
  #hint.hide { opacity: 0; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Double-click or press F: fullscreen · + / −: spiders · B: brightness · H: show this</div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');

  // Silhouette colors. Dark grey on pure black: soft, and blends into the wall.
  const BRIGHTNESS = ['#2b2b35', '#44444f', '#66667a'];
  let level = 1;
  let spiderCount = 12;
  const MIN_SPIDERS = 1, MAX_SPIDERS = 40;

  let W = 0, H = 0, dpr = 1, base = 1;
  const rand = (a, b) => a + Math.random() * (b - a);
  const smooth = t => t * t * (3 - 2 * t);
  const angDiff = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    base = H / 1300;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Spiders ----------
  // Body frame: +x is forward. Four legs per side.
  const ANCHOR_X = [8, 3, -3, -8];
  const REST = [[58, 64], [36, 76], [-8, 76], [-52, 66]]; // [x, |y|]
  const L1 = 38, L2 = 50;

  class Spider {
    constructor(others, anywhere) {
      this.S = base * rand(0.6, 1.3);
      this.seed = rand(0, 100);
      this.speed = rand(50, 85);          // base speed, scaled by size
      this.zigFreq = rand(0.5, 0.9);      // zigzag turns per second
      this.zigAmp = rand(0.45, 0.8);      // zigzag swing in radians
      this.zigPhase = rand(0, 6.28);
      this.heading = -Math.PI / 2;
      this.vx = 0; this.vy = 0;
      this.startup = anywhere;
      this.place(others, anywhere);
      this.feet = [];
      for (let side = 0; side < 2; side++)
        for (let k = 0; k < 4; k++)
          this.feet.push({ side: side ? 1 : -1, k, x: 0, y: 0, fx: 0, fy: 0, tx: 0, ty: 0, t: 1, stepping: false, init: false });
    }
    // Pick a free spot: anywhere on screen at start, below the screen later.
    place(others, anywhere) {
      const margin = 90 * this.S;
      let found = null;
      for (let i = 0; i < 60 && !found; i++) {
        const x = rand(margin, Math.max(margin + 1, W - margin));
        const y = anywhere ? rand(0, H) : H + 110 * this.S + rand(0, 60);
        let free = true;
        for (const o of others) if (o !== this && !o.waiting && Math.hypot(o.x - x, o.y - y) < 120 * (this.S + o.S)) free = false;
        if (free) found = [x, y];
      }
      // No free spot: wait out of sight and try again soon.
      this.waiting = !found;
      this.retry = 0.3;
      if (found) { this.x = found[0]; this.y = found[1]; }
      else { this.x = W / 2; this.y = H + 1000; }
      this.heading = -Math.PI / 2;
      if (this.feet) for (const f of this.feet) { f.init = false; f.stepping = false; }
    }
    footRest(foot) {
      const c = Math.cos(this.heading), s = Math.sin(this.heading), S = this.S;
      const lx = REST[foot.k][0] * S, ly = foot.side * REST[foot.k][1] * S;
      // Look ahead so feet land where the body is going.
      return [this.x + c * lx - s * ly + this.vx * 0.18, this.y + s * lx + c * ly + this.vy * 0.18];
    }
    update(dt, time, others, bats) {
      const S = this.S;
      if (this.waiting) {
        this.retry -= dt;
        if (this.retry <= 0) this.place(others, this.startup);
        return;
      }
      // Zigzag: the swing speed and the speed along the path both drift a little.
      this.zigPhase += dt * this.zigFreq * 2 * Math.PI * (1 + 0.4 * Math.sin(time * 0.7 + this.seed));
      const zig = Math.tanh(2.2 * Math.sin(this.zigPhase)) * this.zigAmp + 0.15 * Math.sin(time * 2.3 + this.seed * 3);
      let dx = Math.sin(zig), dy = -Math.cos(zig);   // up, swung left or right
      // Keep clear of other spiders.
      for (const o of others) {
        if (o === this) continue;
        const ox = this.x - o.x, oy = this.y - o.y;
        const d = Math.hypot(ox, oy) || 1, R = 160 * (S + o.S);
        if (d < R) { const w = (1 - d / R) * 3; dx += ox / d * w; dy += oy / d * w; }
      }
      for (const b of bats) {
        const ox = this.x - b.x, oy = this.y - b.y;
        const d = Math.hypot(ox, oy) || 1, R = 110 * S + 70 * b.S;
        if (d < R) { const w = (1 - d / R) * 3; dx += ox / d * w; dy += oy / d * w; }
      }
      // Stay on screen sideways.
      const m = 90 * S;
      if (this.x < m) dx += (m - this.x) / m * 2;
      if (this.x > W - m) dx -= (this.x - (W - m)) / m * 2;
      const want = Math.atan2(dy, dx);
      this.heading += angDiff(this.heading, want) * Math.min(1, dt * 5);
      // Speed up and slow down a little.
      const mul = 1 + 0.28 * Math.sin(time * 1.3 + this.seed) + 0.15 * Math.sin(time * 3.1 + this.seed * 2);
      const sp = this.speed * mul * S;
      this.vx = Math.cos(this.heading) * sp;
      this.vy = Math.sin(this.heading) * sp;
      this.x += this.vx * dt; this.y += this.vy * dt;
      // Hard separation, so bodies never touch.
      for (const o of others) {
        if (o === this) continue;
        const ox = this.x - o.x, oy = this.y - o.y;
        const d = Math.hypot(ox, oy) || 1, minD = 90 * (S + o.S);
        if (!o.waiting && d < minD) { const p = (minD - d) / 2; this.x += ox / d * p; this.y += oy / d * p; o.x -= ox / d * p; o.y -= oy / d * p; }
      }
      for (const b of bats) {
        const ox = this.x - b.x, oy = this.y - b.y;
        const d = Math.hypot(ox, oy) || 1, minD = 90 * S + 50 * b.S;
        if (d < minD) { this.x += ox / d * (minD - d); this.y += oy / d * (minD - d); }
      }
      if (this.y < -110 * S) { this.startup = false; this.place(others, false); }   // left the top: come back from the bottom
      this.stepFeet(dt);
    }
    stepFeet(dt) {
      const S = this.S;
      const thresh = 16 * S, maxReach = (L1 + L2) * 0.92 * S;
      const c = Math.cos(this.heading), s = Math.sin(this.heading);
      let groupBusy = [false, false];
      for (const f of this.feet) if (f.stepping) groupBusy[(f.k + (f.side > 0 ? 1 : 0)) % 2] = true;
      for (const f of this.feet) {
        const rest = this.footRest(f);
        if (!f.init) { f.x = rest[0]; f.y = rest[1]; f.init = true; }
        const g = (f.k + (f.side > 0 ? 1 : 0)) % 2;
        if (f.stepping) {
          f.t += dt / 0.14;
          if (f.t >= 1) { f.t = 1; f.stepping = false; f.x = f.tx; f.y = f.ty; }
          else { const e = smooth(f.t); f.x = f.fx + (f.tx - f.fx) * e; f.y = f.fy + (f.ty - f.fy) * e; }
        } else {
          const d = Math.hypot(f.x - rest[0], f.y - rest[1]);
          const ax = this.x + c * ANCHOR_X[f.k] * S - s * f.side * 6 * S;
          const ay = this.y + s * ANCHOR_X[f.k] * S + c * f.side * 6 * S;
          const reach = Math.hypot(f.x - ax, f.y - ay);
          if ((d > thresh && !groupBusy[1 - g]) || reach > maxReach) {
            f.stepping = true; f.t = 0; f.fx = f.x; f.fy = f.y; f.tx = rest[0]; f.ty = rest[1];
            groupBusy[g] = true;
          }
        }
      }
    }
    draw(color) {
      if (this.waiting) return;
      const S = this.S;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.heading);
      ctx.scale(S, S);
      ctx.strokeStyle = color; ctx.fillStyle = color;
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      const c = Math.cos(this.heading), s = Math.sin(this.heading);
      for (const f of this.feet) {
        // World foot -> body frame.
        const dx = (f.x - this.x) / S, dy = (f.y - this.y) / S;
        const fx = c * dx + s * dy, fy = -s * dx + c * dy;
        const ax = ANCHOR_X[f.k], ay = f.side * 6;
        const vx = fx - ax, vy = fy - ay;
        let d = Math.hypot(vx, vy);
        const maxD = L1 + L2 - 0.5;
        let ex = fx, ey = fy;
        if (d > maxD) { ex = ax + vx / d * maxD; ey = ay + vy / d * maxD; d = maxD; }
        const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
        const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
        const mx = ax + (ex - ax) * a / d, my = ay + (ey - ay) * a / d;
        const nx = -(ey - ay) / d, ny = (ex - ax) / d;
        let kx = mx + nx * h, ky = my + ny * h;
        const kx2 = mx - nx * h, ky2 = my - ny * h;
        if (f.side * ky2 > f.side * ky) { kx = kx2; ky = ky2; }  // knee bends outward
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(kx, ky); ctx.stroke();
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(ex, ey); ctx.stroke();
      }
      // Abdomen and head.
      ctx.beginPath(); ctx.ellipse(-14, 0, 22, 18, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(10, 0, 14, 12, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  // ---------- Bats ----------
  class Bat {
    constructor() {
      this.dir = Math.random() < 0.5 ? 1 : -1;
      this.S = base * rand(1.4, 2.4);
      this.x = this.dir > 0 ? -80 * this.S : W + 80 * this.S;
      this.y0 = rand(0.12, 0.6) * H;
      this.y = this.y0;
      this.speed = rand(110, 190) * this.S;
      this.t = rand(0, 10);
      this.dead = false;
    }
    update(dt) {
      this.t += dt;
      this.x += this.dir * this.speed * dt;
      this.y = this.y0 + Math.sin(this.t * 1.7) * 40 * this.S;
      if ((this.dir > 0 && this.x > W + 100 * this.S) || (this.dir < 0 && this.x < -100 * this.S)) this.dead = true;
    }
    draw(color) {
      const f = Math.sin(this.t * 11);           // wing flap
      const tip = -f * 22;
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.scale(this.S * this.dir, this.S);
      ctx.fillStyle = color;
      for (const sy of [-1, 1]) {
        ctx.save(); ctx.scale(1, sy);
        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.quadraticCurveTo(14, -16 + tip * 0.5, 34, tip - 6);
        ctx.quadraticCurveTo(30, tip + 4, 24, tip * 0.5 + 6);
        ctx.quadraticCurveTo(18, 2 + tip * 0.2, 12, 8);
        ctx.quadraticCurveTo(6, 2, 0, 6);
        ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 10, 0, 0, Math.PI * 2); ctx.fill();            // body
      ctx.beginPath(); ctx.arc(3, -9, 6, 0, Math.PI * 2); ctx.fill();                     // head
      ctx.beginPath(); ctx.moveTo(0, -13); ctx.lineTo(2, -21); ctx.lineTo(5, -14); ctx.fill(); // ears
      ctx.beginPath(); ctx.moveTo(4, -14); ctx.lineTo(8, -21); ctx.lineTo(9, -12); ctx.fill();
      ctx.restore();
    }
  }

  // ---------- Scene ----------
  let spiders = [], bats = [], batTimer = 3, time = 0, last = performance.now();

  function syncSpiders() {
    while (spiders.length < spiderCount) spiders.push(new Spider(spiders, true));
    spiders.length = spiderCount;
  }
  syncSpiders();

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - last) / 1000));
    last = now; time += dt;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    batTimer -= dt;
    if (batTimer <= 0) { if (bats.length < 3) bats.push(new Bat()); batTimer = rand(6, 14); }
    const color = BRIGHTNESS[level];
    for (const b of bats) { b.update(dt); b.draw(color); }
    bats = bats.filter(b => !b.dead);
    for (const sp of spiders) { sp.update(dt, time, spiders, bats); sp.draw(color); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- Controls ----------
  function toggleFullscreen() {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  }
  let hintTimer;
  function showHint() {
    hint.classList.remove('hide');
    clearTimeout(hintTimer);
    hintTimer = setTimeout(() => hint.classList.add('hide'), 6000);
  }
  showHint();

  window.addEventListener('dblclick', toggleFullscreen);
  window.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'f') toggleFullscreen();
    else if (k === '+' || k === '=') { spiderCount = Math.min(MAX_SPIDERS, spiderCount + 1); syncSpiders(); }
    else if (k === '-' || k === '_') { spiderCount = Math.max(MIN_SPIDERS, spiderCount - 1); syncSpiders(); }
    else if (k === 'b') level = (level + 1) % BRIGHTNESS.length;
    else if (k === 'h') showHint();
  });

  // Hide the mouse cursor when idle.
  let idleTimer;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2000);
  }
  window.addEventListener('mousemove', wake);
  wake();

  // Keep the screen awake while projecting.
  async function keepAwake() {
    try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (_) {}
  }
  keepAwake();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) keepAwake(); });
})();
</script>
</body>
</html>
